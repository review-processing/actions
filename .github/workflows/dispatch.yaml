# Hands a successful PR build over to review-processing/review. Called from a workflow_run
# workflow of the source repository, so it always runs from the default branch and never
# touches PR code. It decides who gets a review (author or /ok-to-review approval); the
# review repository re-validates the other inputs.
#
# Caller:
#   on: { workflow_run: { workflows: [codereview-pr], types: [completed] } }
#   jobs:
#     dispatch:
#       if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
#       uses: review-processing/actions/.github/workflows/dispatch.yaml@<sha>
#       permissions: { actions: read, pull-requests: read }
#       secrets: { dispatch-token: ${{ secrets.REVIEW_DISPATCH_TOKEN }} }

name: dispatch

on:
  workflow_call:
    secrets:
      dispatch-token:
        description: Fine-grained PAT with Actions write on review-processing/review
        required: true

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pull-requests: read
    steps:
      # Missing when the gate of the PR workflow skipped the build.
      - name: Download PR metadata
        id: meta
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: review-meta
          path: ${{ runner.temp }}/meta
          github-token: ${{ github.token }}

      - name: Dispatch the review
        if: ${{ steps.meta.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.dispatch-token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          META: ${{ runner.temp }}/meta/meta.json
        run: |
          set -euo pipefail
          # workflow_run.pull_requests is empty for forks, so the number comes from the artifact: verify it,
          # otherwise a fork could make the review repository cancel the review of another PR.
          pr_number=$(jq -r '.pr_number' "$META")
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number in artifact"; exit 1; }
          pr=$(gh api "repos/$REPO/pulls/$pr_number")
          if [[ "$(jq -r '.head.sha' <<< "$pr")" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$pr_number head is not $HEAD_SHA (outdated run or forged metadata)"
            exit 0
          fi

          # The authorization boundary: review-processing/review does not re-check it.
          # author_association is not used: it reports private org members as CONTRIBUTOR.
          has_write() {
            local role
            role=$(gh api "repos/$REPO/collaborators/$1/permission" --jq '.role_name' 2>/dev/null || echo none)
            [[ "$role" == admin || "$role" == maintain || "$role" == write ]]
          }
          authorized=false
          if has_write "$(jq -r '.user.login' <<< "$pr")"; then
            authorized=true
          else
            # /ok-to-review <sha> comments matching this commit, from users with write access
            while read -r login; do
              if [[ -n "$login" ]] && has_write "$login"; then authorized=true; break; fi
            done < <(gh api "repos/$REPO/issues/$pr_number/comments" --paginate --jq '.[] | "\(.user.login) \(.body)"' \
              | sed -nE 's/^([^ ]+) \/ok-to-review ([0-9a-f]{7,40})[[:space:]]*$/\1 \2/p' \
              | while read -r login sha; do if [[ "$HEAD_SHA" == "$sha"* ]]; then echo "$login"; fi; done | sort -u)
          fi
          if [[ "$authorized" != true ]]; then
            echo "::notice::PR #$pr_number: author has no write access and no '/ok-to-review ${HEAD_SHA}' from a maintainer"
            exit 0
          fi

          GH_TOKEN=$DISPATCH_TOKEN gh workflow run review.yaml -R review-processing/review \
            -f repo="$REPO" -f run_id="$RUN_ID" -f pr_number="$pr_number" -f head_sha="$HEAD_SHA"
          echo "Review of $REPO#$pr_number (${HEAD_SHA:0:7}) dispatched to review-processing/review"

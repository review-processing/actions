# Untrusted half of the AI code review, called from the source repository on pull_request:
# runs PR code with no secrets and a read-only token, then uploads the checkout as artifacts
# for review-processing/review. Everything produced here is attacker-controlled.
#
# Caller:
#   on: { pull_request: { types: [opened, synchronize, reopened, ready_for_review] } }
#   jobs: { review: { uses: review-processing/actions/.github/workflows/pr.yaml@<sha>, permissions: { pull-requests: read } } }

name: pr

on:
  workflow_call:
    inputs:
      install-command:
        description: Command installing dependencies so the reviewer can read them. Must not run lifecycle scripts.
        type: string
        default: pnpm install --frozen-lockfile --ignore-scripts

permissions: {}

jobs:
  # Cheap filter to avoid building for external contributors until a maintainer posts
  # `/ok-to-review <sha>`. Not a security boundary: review-processing/review re-checks it.
  gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Check author or /ok-to-review approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # author_association is not used: it reports private org members as CONTRIBUTOR.
        run: |
          set -euo pipefail
          has_write() {
            local role
            role=$(gh api "repos/$REPO/collaborators/$1/permission" --jq '.role_name' 2>/dev/null || echo none)
            [[ "$role" == admin || "$role" == maintain || "$role" == write ]]
          }
          ok=false
          if has_write "$PR_AUTHOR"; then
            ok=true
          else
            # /ok-to-review <sha> comments matching this commit, from users with write access
            while read -r login; do
              if [[ -n "$login" ]] && has_write "$login"; then ok=true; break; fi
            done < <(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | "\(.user.login) \(.body)"' \
              | sed -nE 's/^([^ ]+) \/ok-to-review ([0-9a-f]{7,40})[[:space:]]*$/\1 \2/p' \
              | while read -r login sha; do if [[ "$HEAD_SHA" == "$sha"* ]]; then echo "$login"; fi; done | sort -u)
          fi
          if [[ "$ok" != true ]]; then
            echo "::notice::$PR_AUTHOR has no write access and no maintainer commented '/ok-to-review ${HEAD_SHA}': AI code review skipped."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: ${{ needs.gate.outputs.ok == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: {}
    concurrency:
      group: review-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # node_modules is only there for the reviewer to read.
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Write PR diff and metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff "$BASE_SHA...$HEAD_SHA" > pr.diff
          mkdir -p "$RUNNER_TEMP/review-meta"
          jq -n --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg base_sha "$BASE_SHA" \
            --arg title "$PR_TITLE" --arg body "$PR_BODY" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha, title: $title, body: $body}' \
            | tee meta.json > "$RUNNER_TEMP/review-meta/meta.json"

      # tar keeps pnpm symlinks and dotfiles that upload-artifact would follow or drop.
      - name: Archive checkout
        run: tar -czf "$RUNNER_TEMP/review-src.tgz" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-meta
          path: ${{ runner.temp }}/review-meta/meta.json
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-src
          path: ${{ runner.temp }}/review-src.tgz
          compression-level: 0
          retention-days: 7
